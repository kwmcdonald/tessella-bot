name: Forecast on new tournament questions

on:
  workflow_dispatch:
  # Main trigger: an outside scheduler (cron-job.org) calls this workflow every 15 minutes
  # via workflow_dispatch, because GitHub's own schedule is unreliable: a top open-source bot
  # measured only ~22% of scheduled runs firing in Aug-Sep 2026. The schedule below is a backup.
  schedule:
    - cron: "7,27,47 * * * *" # backup; already-forecast questions are skipped

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot (exits with an error, and GitHub emails you, only if a question is about to close unanswered)
        run: poetry run python ourbot.py --mode tournament
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}
          # Optional overrides, set under Settings -> Secrets and variables -> Actions -> Variables
          FORECASTER_MODELS: ${{ vars.FORECASTER_MODELS }}
          BACKUP_MODELS: ${{ vars.BACKUP_MODELS }}
          REASONING_EFFORT: ${{ vars.REASONING_EFFORT }}
          INCLUDE_MINIBENCH: ${{ vars.INCLUDE_MINIBENCH }}
          SEARCH_MODELS: ${{ vars.SEARCH_MODELS }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
